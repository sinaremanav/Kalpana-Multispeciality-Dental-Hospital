services:
  # Express.js REST API Backend
  - type: web
    name: kalpana-dental-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production

  # Vite React Frontend (Static Site)
  - type: static
    name: kalpana-dental-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://wbcifzwxlboepvjumori.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
