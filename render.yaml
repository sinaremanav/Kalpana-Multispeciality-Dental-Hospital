services:
  # Express.js REST API Backend
  - type: web
    name: kalpana-dental-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://wbcifzwxlboepvjumori.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  # Vite React Frontend (Static Site)
  - type: static
    name: kalpana-dental-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://wbcifzwxlboepvjumori.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndiY2lmend4bGJvZXB2anVtb3JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MjA5NzcsImV4cCI6MjEwMzI5Njk3N30.NMssTC-MqXLch3E6_eo4lhTimztdMCk6kaQAkX0kA38
      - key: VITE_API_URL
        value: https://kalpana-multispeciality-dental-hospital.onrender.com
